<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>평촌아이티 홍길동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: one 90x50mm card, drawn to scale, type sized from the card's own width; actions sit below it. */
  :root {
    --ground: #efe9ea;
    --card: #ffffff;
    --ink: #1f1a1b;
    --muted: #6d6265;
    --line: #d9cfd1;
    --brand: #e00024;
    --brand-text: #c4001f;
    --on-brand: #ffffff;
    --shadow: 0 1px 2px rgb(60 20 28 / .10), 0 18px 40px -18px rgb(60 20 28 / .28);
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #151112;
      --card: #231d1f;
      --ink: #f6f0f1;
      --muted: #b3a7aa;
      --line: #463a3d;
      --brand-text: #ff7186;
      --shadow: 0 18px 40px -18px rgb(0 0 0 / .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #151112;
    --card: #231d1f;
    --ink: #f6f0f1;
    --muted: #b3a7aa;
    --line: #463a3d;
    --brand-text: #ff7186;
    --shadow: 0 18px 40px -18px rgb(0 0 0 / .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
  }

  .stack {
    display: grid;
    gap: 20px;
    width: 100%;
    max-width: 540px;
    min-width: 0;
  }

  .sizer {
    container-type: inline-size;
    perspective: 900px;
  }

  /* Korean standard card size: 90 x 50 mm */
  .card {
    aspect-ratio: 90 / 50;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6.5cqw 7cqw;
    background: var(--card);
    border-radius: 1.2cqw;
    box-shadow: var(--shadow);
  }

  /* Kinetic: 3D tilt toward the pointer, a glare that follows it, and floating content layers */
  .card {
    --rx: 0deg;
    --ry: 0deg;
    --gx: 50%;
    --gy: 50%;
    --glare: 0;
    position: relative;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2, .9, .25, 1.25), box-shadow .6s ease;
    will-change: transform;
  }
  .card.is-tilting {
    transition: transform .1s linear, box-shadow .3s ease;
    box-shadow: 0 2px 4px rgb(60 20 28 / .10), 0 30px 60px -22px rgb(60 20 28 / .40);
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    /* light where the pointer is, a faint shade away from it */
    background: radial-gradient(circle at var(--gx) var(--gy),
      rgb(255 255 255 / .30), rgb(255 255 255 / 0) 35%, rgb(60 20 28 / .09) 100%);
    opacity: var(--glare);
    transition: opacity .4s ease;
    pointer-events: none;
  }
  .card-top, .details { transform: translateZ(28px); }

  /* Entrance: card rises in, then the content and the panels below follow */
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(28px) rotateX(14deg); }
    to { opacity: 1; transform: none; }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop-in {
    0% { opacity: 0; transform: scale(.4) rotate(-12deg); }
    70% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { transform: none; }
  }
  .sizer { animation: rise-in .9s cubic-bezier(.2, .9, .25, 1) both; transform-style: preserve-3d; }
  .company img { animation: pop-in .7s .35s cubic-bezier(.2, .9, .3, 1.2) both; }
  .company span, .weather { animation: fade-up .6s .5s ease-out both; }
  .person { animation: fade-up .6s .6s ease-out both; }
  .phone { animation: fade-up .6s .7s ease-out both; }
  .quote { animation: fade-up .7s .8s ease-out both; }
  .actions { animation: fade-up .7s .95s ease-out both; }

  .company {
    display: flex;
    align-items: center;
    gap: 2.6cqw;
    margin: 0;
    font-size: max(15px, 4.4cqw);
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .company img {
    display: block;
    width: 9.6cqw;
    height: 9.6cqw;
    flex: none;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3cqw;
  }

  /* Weather: icon + temperature, top-right of the card */
  .weather {
    display: flex;
    align-items: center;
    gap: 1.2cqw;
    margin: 0;
    font-family: var(--mono);
    font-size: max(13px, 3.8cqw);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .weather svg {
    display: block;
    width: max(20px, 6cqw);
    height: max(20px, 6cqw);
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .weather[hidden] { display: none; }

  .details {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 2cqw 4cqw;
  }

  .person {
    display: flex;
    align-items: baseline;
    gap: 2.2cqw;
    margin: 0;
    min-width: 0;
  }
  .name {
    font-size: max(28px, 9.4cqw);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: .06em;
  }
  .role {
    color: var(--muted);
    font-size: max(13px, 3.5cqw);
    font-weight: 500;
  }

  .phone {
    display: flex;
    align-items: baseline;
    gap: 1.6cqw;
    margin: 0;
    font-family: var(--mono);
    font-size: max(13px, 3.5cqw);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .phone abbr {
    color: var(--brand-text);
    text-decoration: none;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding-inline: 18px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: 500 15px/1 var(--sans);
    text-decoration: none;
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary {
    border-color: var(--brand);
    background: var(--brand);
    color: var(--on-brand);
  }
  .btn.primary:hover { border-color: var(--brand-text); }
  .btn:focus-visible {
    outline: 2px solid var(--brand-text);
    outline-offset: 2px;
  }
  .status {
    color: var(--muted);
    font-size: 14px;
  }

  /* Share panel: opens under the action buttons */
  .share {
    display: grid;
    gap: 12px;
    padding: 16px 18px;
    border-radius: 6px;
    background: var(--card);
    animation: fade-up .3s ease-out both;
  }
  .share[hidden] { display: none; }
  .share-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .share-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
  }
  .share-grid .btn {
    justify-content: center;
    min-height: 40px;
    padding-inline: 10px;
    font-size: 14px;
  }
  .share-grid .btn[hidden] { display: none; }
  .share-main {
    grid-column: 1 / -1;
    border-color: var(--brand);
    color: var(--brand-text);
  }
  .share-note {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .share-note:empty { display: none; }
  #share-toggle[aria-expanded="true"] {
    border-color: var(--ink);
  }

  /* Quote of the day: loaded from the advice API, sits under the card */
  .quote {
    display: grid;
    gap: 10px;
    margin: 0;
    padding: 18px 20px;
    border-left: 3px solid var(--brand);
    border-radius: 0 6px 6px 0;
    background: var(--card);
  }
  .quote-message {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.6;
    text-wrap: pretty;
    word-break: keep-all;
  }
  .quote-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
  }
  .quote-author {
    color: var(--muted);
    font-size: 14px;
    font-style: normal;
  }
  .quote-author strong {
    color: var(--ink);
    font-weight: 700;
  }
  .quote .btn {
    min-height: 36px;
    padding-inline: 12px;
    font-size: 14px;
  }
  .quote[aria-busy="true"] .quote-message { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .sizer, .company img, .company span, .weather, .person, .phone, .quote, .actions, .share { animation: none; }
    .card { transform: none; transition: none; }
    .card::after { display: none; }
  }
</style>
</head>
<body>

<main class="stack">
  <div class="sizer">
    <article class="card" aria-label="평촌아이티 홍길동 사원 명함">
      <div class="card-top">
        <p class="company">
          <img src="logo.png" alt="평촌아이티 로고" width="489" height="489">
          <span>평촌아이티</span>
        </p>
        <p class="weather" id="weather" hidden>
          <span id="weather-icon"></span>
          <span id="weather-temp"></span>
        </p>
      </div>
      <div class="details">
        <h1 class="person">
          <span class="name">홍길동</span>
          <span class="role">사원</span>
        </h1>
        <p class="phone">
          <abbr title="휴대전화">M</abbr>
          <span id="phone-number">010-1234-5678</span>
        </p>
      </div>
    </article>
  </div>

  <figure class="quote" id="quote" aria-live="polite" aria-busy="true">
    <blockquote class="quote-message" id="quote-message">명언을 불러오는 중…</blockquote>
    <figcaption class="quote-footer">
      <cite class="quote-author" id="quote-author"></cite>
      <button class="btn" id="quote-next" type="button">다른 명언</button>
    </figcaption>
  </figure>

  <div class="actions">
    <a class="btn primary" href="tel:01012345678">전화 걸기</a>
    <button class="btn" id="copy-phone" type="button">번호 복사</button>
    <button class="btn" id="share-toggle" type="button" aria-expanded="false" aria-controls="share-panel">공유하기</button>
    <span class="status" id="copy-status" role="status"></span>
  </div>

  <section class="share" id="share-panel" aria-labelledby="share-title" hidden>
    <h2 class="share-title" id="share-title">명함 공유하기</h2>
    <div class="share-grid">
      <button class="btn share-main" id="share-native" type="button" hidden>앱으로 공유 (카카오톡 등)</button>
      <button class="btn" id="share-copy" type="button">링크 복사</button>
      <a class="btn" id="share-email">이메일</a>
      <a class="btn" id="share-sms" hidden>문자</a>
      <a class="btn" id="share-facebook" target="_blank" rel="noopener">페이스북</a>
      <a class="btn" id="share-x" target="_blank" rel="noopener">X (트위터)</a>
      <a class="btn" id="share-naver" target="_blank" rel="noopener">네이버</a>
      <a class="btn" id="share-line" target="_blank" rel="noopener">라인</a>
    </div>
    <p class="share-note" id="share-note" role="status"></p>
  </section>
</main>

<script>
  const number = document.getElementById("phone-number");
  const status = document.getElementById("copy-status");

  function selectNumber() {
    const range = document.createRange();
    range.selectNodeContents(number);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    status.textContent = "번호를 선택했습니다. Ctrl+C로 복사하세요.";
  }

  document.getElementById("copy-phone").addEventListener("click", () => {
    if (!navigator.clipboard) {
      selectNumber();
      return;
    }
    navigator.clipboard.writeText(number.textContent).then(
      () => { status.textContent = "번호를 복사했습니다."; },
      selectNumber
    );
  });

  // 명언 API: { message, author, authorProfile }
  const ADVICE_URL = "https://kradvice-pitca.vercel.app/api/advice";
  const quoteBox = document.getElementById("quote");
  const quoteMessage = document.getElementById("quote-message");
  const quoteAuthor = document.getElementById("quote-author");
  const quoteNext = document.getElementById("quote-next");

  async function loadQuote() {
    quoteBox.setAttribute("aria-busy", "true");
    quoteNext.disabled = true;
    try {
      const response = await fetch(ADVICE_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      const data = await response.json();

      quoteMessage.textContent = `“${data.message}”`;
      quoteAuthor.replaceChildren();
      const name = document.createElement("strong");
      name.textContent = data.author;
      quoteAuthor.append(name);
      if (data.authorProfile) quoteAuthor.append(` · ${data.authorProfile}`);
    } catch (error) {
      quoteMessage.textContent = "명언을 불러오지 못했습니다. 잠시 후 다시 시도하세요.";
      quoteAuthor.textContent = "";
    } finally {
      quoteBox.setAttribute("aria-busy", "false");
      quoteNext.disabled = false;
    }
  }

  quoteNext.addEventListener("click", loadQuote);
  loadQuote();

  // 날씨 (Open-Meteo): 내 위치 → 실패하면 평촌(안양)
  const DEFAULT_PLACE = { latitude: 37.39, longitude: 126.96 };
  const weatherBox = document.getElementById("weather");
  const weatherIcon = document.getElementById("weather-icon");
  const weatherTemp = document.getElementById("weather-temp");

  const CLOUD = "M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.24";
  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    cloudSun: '<path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
    cloudMoon: '<path d="M13 16a3 3 0 1 1 0 6H7a5 5 0 1 1 4.9-6Z"/><path d="M10.1 9A6 6 0 0 1 16 4a4 4 0 0 0 6 6 6 6 0 0 1-3 5.2"/>',
    cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
    fog: `<path d="${CLOUD}"/><path d="M16 17H7M17 21H9"/>`,
    drizzle: `<path d="${CLOUD}"/><path d="M8 19v1M8 14v1M16 19v1M16 14v1M12 21v1M12 16v1"/>`,
    rain: `<path d="${CLOUD}"/><path d="M16 14v6M8 14v6M12 16v6"/>`,
    snow: `<path d="${CLOUD}"/><path d="M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>`,
    storm: '<path d="M6 16.33A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97"/><path d="m13 12-3 5h4l-3 5"/>',
  };

  // WMO 날씨 코드 → 아이콘, 설명
  function describeWeather(code, isDay) {
    if (code === 0) return [isDay ? "sun" : "moon", "맑음"];
    if (code <= 2) return [isDay ? "cloudSun" : "cloudMoon", "구름 조금"];
    if (code === 3) return ["cloud", "흐림"];
    if (code <= 48) return ["fog", "안개"];
    if (code <= 57) return ["drizzle", "이슬비"];
    if (code <= 67 || (code >= 80 && code <= 82)) return ["rain", "비"];
    if (code <= 77 || code === 85 || code === 86) return ["snow", "눈"];
    return ["storm", "뇌우"];
  }

  function getPosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(DEFAULT_PLACE);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve(pos.coords),
        () => resolve(DEFAULT_PLACE),
        { timeout: 5000, maximumAge: 30 * 60 * 1000 }
      );
    });
  }

  async function loadWeather() {
    try {
      const { latitude, longitude } = await getPosition();
      const url = "https://api.open-meteo.com/v1/forecast"
        + `?latitude=${latitude.toFixed(2)}&longitude=${longitude.toFixed(2)}`
        + "&current=temperature_2m,weather_code,is_day&timezone=auto";
      const response = await fetch(url);
      if (!response.ok) throw new Error(response.status);
      const { current } = await response.json();

      const [icon, label] = describeWeather(current.weather_code, current.is_day === 1);
      const temp = `${Math.round(current.temperature_2m)}°`;
      weatherIcon.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[icon]}</svg>`;
      weatherTemp.textContent = temp;
      weatherBox.setAttribute("aria-label", `현재 날씨 ${label}, ${temp}C`);
      weatherBox.title = label;
      weatherBox.hidden = false;
    } catch (error) {
      weatherBox.hidden = true;
    }
  }

  loadWeather();

  // 키네틱 효과: 포인터 위치에 따라 명함이 기울고 빛이 따라다닙니다
  const card = document.querySelector(".card");
  const MAX_TILT = 10; // 최대 기울기(도)
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let frame = 0;

  function tilt(event) {
    if (reduceMotion.matches) return;
    const rect = card.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;   // 0(왼쪽) ~ 1(오른쪽)
    const y = (event.clientY - rect.top) / rect.height;   // 0(위) ~ 1(아래)
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      card.classList.add("is-tilting");
      card.style.setProperty("--ry", `${(x - 0.5) * 2 * MAX_TILT}deg`);
      card.style.setProperty("--rx", `${(0.5 - y) * 2 * MAX_TILT}deg`);
      card.style.setProperty("--gx", `${x * 100}%`);
      card.style.setProperty("--gy", `${y * 100}%`);
      card.style.setProperty("--glare", "1");
    });
  }

  function resetTilt() {
    cancelAnimationFrame(frame);
    card.classList.remove("is-tilting");
    card.style.setProperty("--rx", "0deg");
    card.style.setProperty("--ry", "0deg");
    card.style.setProperty("--glare", "0");
  }

  card.addEventListener("pointermove", tilt);
  card.addEventListener("pointerdown", tilt);
  card.addEventListener("pointerleave", resetTilt);
  card.addEventListener("pointerup", (event) => {
    if (event.pointerType !== "mouse") resetTilt();
  });
  card.addEventListener("pointercancel", resetTilt);

  // 명함 공유: 별도 설정 없이 링크로 연결되는 방법만 사용합니다
  const shareUrl = location.href.split("#")[0];
  const shareTitle = "평촌아이티 홍길동 사원 명함";
  const shareText = "평촌아이티 홍길동 사원의 온라인 명함입니다.";
  const shareToggle = document.getElementById("share-toggle");
  const sharePanel = document.getElementById("share-panel");
  const shareNote = document.getElementById("share-note");
  const enc = encodeURIComponent;
  const isLocalFile = location.protocol === "file:";

  const shareLinks = {
    "share-email": `mailto:?subject=${enc(shareTitle)}&body=${enc(`${shareText}\n${shareUrl}`)}`,
    "share-sms": `sms:?&body=${enc(`${shareText} ${shareUrl}`)}`,
    "share-facebook": `https://www.facebook.com/sharer/sharer.php?u=${enc(shareUrl)}`,
    "share-x": `https://x.com/intent/tweet?text=${enc(shareText)}&url=${enc(shareUrl)}`,
    "share-naver": `https://share.naver.com/web/shareView?url=${enc(shareUrl)}&title=${enc(shareTitle)}`,
    "share-line": `https://social-plugins.line.me/lineit/share?url=${enc(shareUrl)}`,
  };
  for (const [id, href] of Object.entries(shareLinks)) {
    document.getElementById(id).href = href;
  }

  // 휴대폰 기본 공유 창(카카오톡·메시지 등)은 지원하는 브라우저에서만 보여 줍니다
  if (navigator.share) document.getElementById("share-native").hidden = false;
  // 문자는 휴대폰처럼 터치 화면에서만 보여 줍니다
  if (window.matchMedia("(pointer: coarse)").matches) document.getElementById("share-sms").hidden = false;

  shareToggle.addEventListener("click", () => {
    const open = sharePanel.hidden;
    sharePanel.hidden = !open;
    shareToggle.setAttribute("aria-expanded", String(open));
    shareNote.textContent = isLocalFile
      ? "지금은 내 컴퓨터에서 연 페이지라 다른 사람이 이 주소를 열 수 없습니다. GitHub Pages 주소로 연 뒤 공유하세요."
      : "";
  });

  document.getElementById("share-native").addEventListener("click", async () => {
    try {
      await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });
    } catch (error) {
      // 사용자가 공유 창을 닫은 경우는 그냥 넘어갑니다
      if (error.name !== "AbortError") shareNote.textContent = "공유 창을 열지 못했습니다. 링크 복사를 이용하세요.";
    }
  });

  document.getElementById("share-copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      shareNote.textContent = "명함 링크를 복사했습니다. 원하는 곳에 붙여 넣으세요.";
    } catch (error) {
      window.prompt("아래 링크를 복사하세요.", shareUrl);
    }
  });
</script>
</body>
</html>
