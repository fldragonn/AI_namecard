<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>평촌아이티 홍길동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Concept: a clean printed card on a desk, and keyboard keycaps for every action.
     Red belongs to the logo and the call key only. */
  :root {
    --ground: #e6e8eb;      /* desk grey */
    --card: #ffffff;        /* card stock */
    --ink: #1f1a1b;
    --muted: #6b6f76;
    --key: #f6f6f4;         /* keycap top */
    --key-edge: #c5c9cf;    /* keycap side */
    --brand: #e00024;       /* logo red */
    --brand-edge: #a8001b;
    --on-brand: #ffffff;
    --focus: #1f1a1b;
    --shadow: 0 1px 2px rgb(20 24 30 / .10), 0 18px 40px -18px rgb(20 24 30 / .30);
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121315;
      --card: #1e2023;
      --ink: #f2f2f0;
      --muted: #a3a7ae;
      --key: #2a2d31;
      --key-edge: #0d0e10;
      --focus: #f2f2f0;
      --shadow: 0 18px 40px -18px rgb(0 0 0 / .8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121315;
    --card: #1e2023;
    --ink: #f2f2f0;
    --muted: #a3a7ae;
    --key: #2a2d31;
    --key-edge: #0d0e10;
    --focus: #f2f2f0;
    --shadow: 0 18px 40px -18px rgb(0 0 0 / .8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    display: grid;
    justify-items: center;
    align-content: start;   /* phone: stack from the top */
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
  }
  @media (min-width: 640px) and (min-height: 700px) {
    body { min-height: 100vh; align-content: center; }  /* larger screens: centre it */
  }

  .stack {
    display: grid;
    gap: 22px;
    width: 100%;
    max-width: 520px;
    min-width: 0;
  }

  /* ---------- Card: 90 x 50 mm, type sized from the card's own width ---------- */
  .sizer {
    container-type: inline-size;
    perspective: 900px;
  }
  .card {
    --rx: 0deg;
    --ry: 0deg;
    --gx: 50%;
    --gy: 50%;
    --glare: 0;
    position: relative;
    aspect-ratio: 90 / 50;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6.5cqw 7cqw;
    background: var(--card);
    border-radius: 1.6cqw;
    box-shadow: var(--shadow);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.2, .9, .25, 1.25), box-shadow .6s ease;
    will-change: transform;
  }
  .card.is-tilting {
    transition: transform .1s linear, box-shadow .3s ease;
    box-shadow: 0 2px 4px rgb(20 24 30 / .10), 0 30px 60px -22px rgb(20 24 30 / .42);
  }
  /* light where the pointer is, a faint shade away from it */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--gx) var(--gy),
      rgb(255 255 255 / .30), rgb(255 255 255 / 0) 35%, rgb(20 24 30 / .09) 100%);
    opacity: var(--glare);
    transition: opacity .4s ease;
    pointer-events: none;
  }
  .card-top, .details { transform: translateZ(28px); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3cqw;
  }
  .company {
    display: flex;
    align-items: center;
    gap: 2.6cqw;
    margin: 0;
    font-size: max(15px, 4.4cqw);
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .company img {
    display: block;
    width: 9.6cqw;
    height: 9.6cqw;
    flex: none;
  }

  .weather {
    display: flex;
    align-items: center;
    gap: 1.2cqw;
    margin: 0;
    font-size: max(14px, 3.9cqw);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .weather[hidden] { display: none; }
  .weather svg {
    display: block;
    width: max(20px, 6cqw);
    height: max(20px, 6cqw);
    flex: none;
  }

  .details {
    display: grid;
    gap: 1.6cqw;
  }
  .person {
    display: flex;
    align-items: baseline;
    gap: 2.4cqw;
    margin: 0;
  }
  .name {
    font-size: max(30px, 10cqw);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: .04em;
  }
  .role {
    color: var(--muted);
    font-size: max(14px, 3.8cqw);
    font-weight: 500;
  }
  .phone {
    margin: 0;
    font-size: max(15px, 4.2cqw);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: .03em;
  }

  /* ---------- Quote: quiet text under the card, no box ---------- */
  .quote {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 6px 14px;
    margin: 0;
    padding-inline: 4px;
  }
  .quote-message {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.65;
    text-wrap: pretty;
    word-break: keep-all;
  }
  .quote[aria-busy="true"] .quote-message { color: var(--muted); }
  .quote-author {
    grid-column: 1;
    display: grid;
    gap: 2px;
    color: var(--muted);
    font-size: 13px;
    font-style: normal;
    line-height: 1.5;
    word-break: keep-all;
  }
  .quote-author strong {
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
  }
  .quote .key-icon {
    grid-column: 2;
    grid-row: 1 / span 2;
    width: 40px;
    height: 40px;
  }

  /* ---------- Keycaps ---------- */
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0;
    padding: 0;
    border: 1px solid var(--key-edge);
    border-radius: 10px;
    background: var(--key);
    color: var(--ink);
    font: 500 16px/1 var(--sans);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--key-edge), 0 6px 10px -6px rgb(0 0 0 / .35);
    transition: transform .08s ease, box-shadow .08s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .key:active, .key.is-pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--key-edge), 0 2px 4px -2px rgb(0 0 0 / .35);
  }
  .key:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 4px;
  }
  .key:disabled { cursor: progress; opacity: .6; }
  .key svg {
    display: block;
    width: 22px;
    height: 22px;
    flex: none;
  }
  .key-call {
    width: 100%;
    min-height: 56px;
    border-color: var(--brand-edge);
    background: var(--brand);
    color: var(--on-brand);
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 4px 0 var(--brand-edge), 0 8px 14px -8px rgb(168 0 27 / .6);
  }
  .key-call:active, .key-call.is-pressed {
    box-shadow: 0 1px 0 var(--brand-edge), 0 2px 4px -2px rgb(168 0 27 / .6);
  }
  .key-icon {
    width: 48px;
    height: 48px;
  }

  .actions {
    display: grid;
    gap: 20px;
  }
  .share-keys {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(36px, 1fr));
    gap: 14px 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .share-keys li {
    display: grid;
    justify-items: center;
    gap: 8px;
    grid-template-columns: minmax(0, 1fr);
    min-width: 0;   /* a long caption must not widen its column */
  }
  .share-keys li[hidden] { display: none; }
  .share-keys .key-icon {
    width: 100%;
    max-width: 48px;
    height: auto;
    aspect-ratio: 1;
  }
  .share-keys .caption {
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
    width: max-content;   /* overflows evenly on both sides when the column is narrow */
  }
  .note {
    margin: -4px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .note:empty { display: none; }

  /* ---------- One entrance moment: the card rises, the logo pops ---------- */
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(28px) rotateX(14deg); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop-in {
    0% { opacity: 0; transform: scale(.4) rotate(-12deg); }
    70% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { transform: none; }
  }
  .sizer { animation: rise-in .9s cubic-bezier(.2, .9, .25, 1) both; transform-style: preserve-3d; }
  .company img { animation: pop-in .7s .35s cubic-bezier(.2, .9, .3, 1.2) both; }

  @media (prefers-reduced-motion: reduce) {
    .sizer, .company img { animation: none; }
    .card { transform: none; transition: none; }
    .card::after { display: none; }
    .key { transition: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  </defs>
</svg>

<main class="stack">
  <div class="sizer">
    <article class="card" aria-label="평촌아이티 홍길동 사원 명함">
      <div class="card-top">
        <p class="company">
          <img src="logo.png" alt="평촌아이티 로고" width="489" height="489">
          <span>평촌아이티</span>
        </p>
        <p class="weather" id="weather" hidden>
          <span id="weather-icon"></span>
          <span id="weather-temp"></span>
        </p>
      </div>
      <div class="details">
        <h1 class="person">
          <span class="name">홍길동</span>
          <span class="role">사원</span>
        </h1>
        <p class="phone">010-1234-5678</p>
      </div>
    </article>
  </div>

  <figure class="quote" id="quote" aria-live="polite" aria-busy="true">
    <blockquote class="quote-message" id="quote-message">명언을 불러오는 중…</blockquote>
    <figcaption class="quote-author" id="quote-author"></figcaption>
    <button class="key key-icon" id="quote-next" type="button" aria-label="다른 명언 보기" title="다른 명언">
      <svg aria-hidden="true"><use href="#i-refresh"/></svg>
    </button>
  </figure>

  <div class="actions">
    <a class="key key-call" href="tel:01012345678">
      <svg aria-hidden="true"><use href="#i-phone"/></svg>
      전화 걸기
    </a>

    <ul class="share-keys" aria-label="명함 공유">
      <li id="share-native-item" hidden>
        <button class="key key-icon" id="share-native" type="button" aria-label="앱으로 공유 (카카오톡 등)" title="앱으로 공유">
          <svg aria-hidden="true"><use href="#i-share"/></svg>
        </button>
        <span class="caption" aria-hidden="true">공유</span>
      </li>
      <li>
        <button class="key key-icon" id="share-copy" type="button" aria-label="링크 복사" title="링크 복사">
          <svg aria-hidden="true"><use href="#i-link"/></svg>
        </button>
        <span class="caption" aria-hidden="true">링크</span>
      </li>
      <li>
        <a class="key key-icon share-link" id="share-email" aria-label="이메일로 공유" title="이메일">
          <svg aria-hidden="true"><use href="#i-mail"/></svg>
        </a>
        <span class="caption" aria-hidden="true">메일</span>
      </li>
      <li>
        <a class="key key-icon share-link" id="share-facebook" target="_blank" rel="noopener" aria-label="페이스북으로 공유" title="페이스북">
          <svg aria-hidden="true"><use href="#i-facebook"/></svg>
        </a>
        <span class="caption" aria-hidden="true">페이스북</span>
      </li>
      <li>
        <a class="key key-icon share-link" id="share-x" target="_blank" rel="noopener" aria-label="X(트위터)로 공유" title="X">
          <svg aria-hidden="true"><use href="#i-x"/></svg>
        </a>
        <span class="caption" aria-hidden="true">X</span>
      </li>
      <li>
        <a class="key key-icon share-link" id="share-naver" target="_blank" rel="noopener" aria-label="네이버로 공유" title="네이버">
          <svg aria-hidden="true"><use href="#i-naver"/></svg>
        </a>
        <span class="caption" aria-hidden="true">네이버</span>
      </li>
      <li>
        <a class="key key-icon share-link" id="share-line" target="_blank" rel="noopener" aria-label="라인으로 공유" title="라인">
          <svg aria-hidden="true"><use href="#i-line"/></svg>
        </a>
        <span class="caption" aria-hidden="true">라인</span>
      </li>
    </ul>
    <p class="note" id="share-note" role="status"></p>
  </div>
</main>

<script>
  // 명언 API: { message, author, authorProfile }
  const ADVICE_URL = "https://kradvice-pitca.vercel.app/api/advice";
  const quoteBox = document.getElementById("quote");
  const quoteMessage = document.getElementById("quote-message");
  const quoteAuthor = document.getElementById("quote-author");
  const quoteNext = document.getElementById("quote-next");

  async function loadQuote() {
    quoteBox.setAttribute("aria-busy", "true");
    quoteNext.disabled = true;
    try {
      const response = await fetch(ADVICE_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      const data = await response.json();

      quoteMessage.textContent = `“${data.message}”`;
      quoteAuthor.replaceChildren();
      const name = document.createElement("strong");
      name.textContent = data.author;
      quoteAuthor.append(name);
      if (data.authorProfile && data.authorProfile.trim() !== "-") {
        const profile = document.createElement("span");
        profile.textContent = data.authorProfile;
        quoteAuthor.append(profile);
      }
    } catch (error) {
      quoteMessage.textContent = "명언을 불러오지 못했습니다. 잠시 후 다시 시도하세요.";
      quoteAuthor.textContent = "";
    } finally {
      quoteBox.setAttribute("aria-busy", "false");
      quoteNext.disabled = false;
    }
  }

  quoteNext.addEventListener("click", loadQuote);
  loadQuote();

  // 날씨 (Open-Meteo): 내 위치 → 실패하면 평촌(안양)
  const DEFAULT_PLACE = { latitude: 37.39, longitude: 126.96 };
  const weatherBox = document.getElementById("weather");
  const weatherIcon = document.getElementById("weather-icon");
  const weatherTemp = document.getElementById("weather-temp");

  const CLOUD = "M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.24";
  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    cloudSun: '<path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
    cloudMoon: '<path d="M13 16a3 3 0 1 1 0 6H7a5 5 0 1 1 4.9-6Z"/><path d="M10.1 9A6 6 0 0 1 16 4a4 4 0 0 0 6 6 6 6 0 0 1-3 5.2"/>',
    cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
    fog: `<path d="${CLOUD}"/><path d="M16 17H7M17 21H9"/>`,
    drizzle: `<path d="${CLOUD}"/><path d="M8 19v1M8 14v1M16 19v1M16 14v1M12 21v1M12 16v1"/>`,
    rain: `<path d="${CLOUD}"/><path d="M16 14v6M8 14v6M12 16v6"/>`,
    snow: `<path d="${CLOUD}"/><path d="M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>`,
    storm: '<path d="M6 16.33A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97"/><path d="m13 12-3 5h4l-3 5"/>',
  };

  // WMO 날씨 코드 → 아이콘, 설명
  function describeWeather(code, isDay) {
    if (code === 0) return [isDay ? "sun" : "moon", "맑음"];
    if (code <= 2) return [isDay ? "cloudSun" : "cloudMoon", "구름 조금"];
    if (code === 3) return ["cloud", "흐림"];
    if (code <= 48) return ["fog", "안개"];
    if (code <= 57) return ["drizzle", "이슬비"];
    if (code <= 67 || (code >= 80 && code <= 82)) return ["rain", "비"];
    if (code <= 77 || code === 85 || code === 86) return ["snow", "눈"];
    return ["storm", "뇌우"];
  }

  function getPosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(DEFAULT_PLACE);
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve(pos.coords),
        () => resolve(DEFAULT_PLACE),
        { timeout: 5000, maximumAge: 30 * 60 * 1000 }
      );
    });
  }

  async function loadWeather() {
    try {
      const { latitude, longitude } = await getPosition();
      const url = "https://api.open-meteo.com/v1/forecast"
        + `?latitude=${latitude.toFixed(2)}&longitude=${longitude.toFixed(2)}`
        + "&current=temperature_2m,weather_code,is_day&timezone=auto";
      const response = await fetch(url);
      if (!response.ok) throw new Error(response.status);
      const { current } = await response.json();

      const [icon, label] = describeWeather(current.weather_code, current.is_day === 1);
      const temp = `${Math.round(current.temperature_2m)}°`;
      weatherIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[icon]}</svg>`;
      weatherTemp.textContent = temp;
      weatherBox.setAttribute("aria-label", `현재 날씨 ${label}, ${temp}C`);
      weatherBox.title = label;
      weatherBox.hidden = false;
    } catch (error) {
      weatherBox.hidden = true;
    }
  }

  loadWeather();

  // 키네틱 효과: 포인터 위치에 따라 명함이 기울고 빛이 따라다닙니다
  const card = document.querySelector(".card");
  const MAX_TILT = 10; // 최대 기울기(도)
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let frame = 0;

  function tilt(event) {
    if (reduceMotion.matches) return;
    const rect = card.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;   // 0(왼쪽) ~ 1(오른쪽)
    const y = (event.clientY - rect.top) / rect.height;   // 0(위) ~ 1(아래)
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      card.classList.add("is-tilting");
      card.style.setProperty("--ry", `${(x - 0.5) * 2 * MAX_TILT}deg`);
      card.style.setProperty("--rx", `${(0.5 - y) * 2 * MAX_TILT}deg`);
      card.style.setProperty("--gx", `${x * 100}%`);
      card.style.setProperty("--gy", `${y * 100}%`);
      card.style.setProperty("--glare", "1");
    });
  }

  function resetTilt() {
    cancelAnimationFrame(frame);
    card.classList.remove("is-tilting");
    card.style.setProperty("--rx", "0deg");
    card.style.setProperty("--ry", "0deg");
    card.style.setProperty("--glare", "0");
  }

  card.addEventListener("pointermove", tilt);
  card.addEventListener("pointerdown", tilt);
  card.addEventListener("pointerleave", resetTilt);
  card.addEventListener("pointerup", (event) => {
    if (event.pointerType !== "mouse") resetTilt();
  });
  card.addEventListener("pointercancel", resetTilt);

  // 명함 공유: 별도 설정 없이 링크로 연결되는 방법만 사용합니다
  const shareUrl = location.href.split("#")[0];
  const shareTitle = "평촌아이티 홍길동 사원 명함";
  const shareText = "평촌아이티 홍길동 사원의 온라인 명함입니다.";
  const shareNote = document.getElementById("share-note");
  const enc = encodeURIComponent;
  const isLocalFile = location.protocol === "file:";

  const shareLinks = {
    "share-email": `mailto:?subject=${enc(shareTitle)}&body=${enc(`${shareText}\n${shareUrl}`)}`,
    "share-facebook": `https://www.facebook.com/sharer/sharer.php?u=${enc(shareUrl)}`,
    "share-x": `https://x.com/intent/tweet?text=${enc(shareText)}&url=${enc(shareUrl)}`,
    "share-naver": `https://share.naver.com/web/shareView?url=${enc(shareUrl)}&title=${enc(shareTitle)}`,
    "share-line": `https://social-plugins.line.me/lineit/share?url=${enc(shareUrl)}`,
  };
  for (const [id, href] of Object.entries(shareLinks)) {
    document.getElementById(id).href = href;
  }

  // 내 컴퓨터에서 연 페이지는 다른 사람이 열 수 없으므로 공유할 때 알려 줍니다
  function warnIfLocal() {
    if (isLocalFile) {
      shareNote.textContent = "지금은 내 컴퓨터에서 연 페이지라 다른 사람이 이 주소를 열 수 없습니다. GitHub Pages 주소로 연 뒤 공유하세요.";
    }
  }
  document.querySelectorAll(".share-link").forEach((link) => link.addEventListener("click", warnIfLocal));

  // 휴대폰 기본 공유 창(카카오톡·문자 등)은 지원하는 브라우저에서만 보여 줍니다
  if (navigator.share) document.getElementById("share-native-item").hidden = false;

  document.getElementById("share-native").addEventListener("click", async () => {
    warnIfLocal();
    try {
      await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });
    } catch (error) {
      // 사용자가 공유 창을 닫은 경우는 그냥 넘어갑니다
      if (error.name !== "AbortError") shareNote.textContent = "공유 창을 열지 못했습니다. 링크 복사를 이용하세요.";
    }
  });

  document.getElementById("share-copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      shareNote.textContent = "명함 링크를 복사했습니다. 원하는 곳에 붙여 넣으세요.";
      warnIfLocal();
    } catch (error) {
      window.prompt("아래 링크를 복사하세요.", shareUrl);
    }
  });
</script>
</body>
</html>
